name: test
on:
  push:
    branches:
      - main
    paths:
      - "**.cs"
  pull_request:
    branches:
      - main
    paths:
      - "**.cs"
      - "**.csproj"
      - "**.props"
      - "global.json"
      - ".config/dotnet-tools.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            framework: net9.0
          - os: ubuntu-latest
            framework: net10.0
          - os: ubuntu-latest
            framework: net11.0
          - os: windows-latest
            framework: net9.0
          - os: windows-latest
            framework: net10.0
          - os: windows-latest
            framework: net11.0
          - os: macos-latest
            framework: net9.0
          - os: macos-latest
            framework: net10.0
          - os: macos-latest
            framework: net11.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --framework ${{ matrix.framework }} --no-restore
      - name: Test & collect coverage
        shell: pwsh
        run: |
          dotnet test -c Release --framework ${{ matrix.framework }} --no-restore --no-build `
          --coverage --coverage-output-format xml `
          --coverage-output ${{ runner.temp }}/coverage-${{ matrix.os }}-${{ matrix.framework }}.xml
      - name: Install Report Generator
        run: dotnet tool restore
      - name: Generate coverage report
        shell: pwsh
        run: |
          dotnet tool run reportgenerator `
            -reports:"${{ runner.temp }}/coverage-${{ matrix.os }}-${{ matrix.framework }}.xml" `
            -targetdir:"$env:RUNNER_TEMP/coverage-report-${{ matrix.os }}-${{ matrix.framework }}" `
            -reporttypes:"Badges;MarkdownSummaryGithub"
      - name: Create coverage-reports branch and push content
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git fetch origin coverage-reports
          git checkout coverage-reports || git checkout -b coverage-reports
          cp -rp ${{ runner.temp }}/coverage-report-${{ matrix.os }}-${{ matrix.framework }}/badge_combined.svg ./
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add badge_combined.svg
          git commit -m "Update coverage reports" || echo "No changes to commit"
          git push origin coverage-reports
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.framework }}
          path: ${{ runner.temp }}/coverage-report-${{ matrix.os }}-${{ matrix.framework }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Show coverage in summary
        shell: pwsh
        run: |
          Get-Content ${{ runner.temp }}/coverage-report-${{ matrix.os }}-${{ matrix.framework }}/SummaryGithub.md |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
