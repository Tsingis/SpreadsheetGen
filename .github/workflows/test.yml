name: test
on:
  pull_request:
    branches:
      - main
    paths:
      - "**.cs"
      - "**.csproj"
      - "**.props"
      - "global.json"
      - ".config/dotnet-tools.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            framework: net9.0
          - os: ubuntu-latest
            framework: net10.0
          - os: windows-latest
            framework: net9.0
          - os: windows-latest
            framework: net10.0
          - os: macos-latest
            framework: net9.0
          - os: macos-latest
            framework: net10.0
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --framework ${{ matrix.framework }} --no-restore
      - name: Test & collect coverage
        shell: bash
        run: |
          dotnet test -c Release --framework ${{ matrix.framework }} --no-restore --no-build -- \
          --coverage --coverage-output-format xml --coverage-output ${{ github.workspace }}/coverage.xml
      - name: Install Report Generator
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        run: dotnet tool restore
      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        shell: pwsh
        run: |
          dotnet tool run reportgenerator `
            -reports:"${{ github.workspace }}/**/coverage.xml" `
            -targetdir:"coverage-report" `
            -reporttypes:MarkdownSummaryGithub
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-report
          path: coverage-report
      - name: Show coverage in summary
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        shell: pwsh
        run: |
          Get-Content coverage-report/SummaryGithub.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
