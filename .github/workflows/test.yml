name: test
on:
  pull_request:
    branches:
      - main
    paths:
      - "**.cs"
      - "**.csproj"
      - "**.props"
      - "global.json"
      - ".config/dotnet-tools.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            framework: net9.0
          - os: ubuntu-latest
            framework: net10.0
          - os: windows-latest
            framework: net9.0
          - os: windows-latest
            framework: net10.0
          - os: macos-latest
            framework: net9.0
          - os: macos-latest
            framework: net10.0
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --framework ${{ matrix.framework }} --no-restore
      - name: Test & collect coverage
        shell: bash
        run: |
          dotnet test -c Release --framework ${{ matrix.framework }} --no-restore --no-build -- \
          --coverage --coverage-output-format xml \
          --coverage-output ${{ github.workspace }}/coverage-${{ matrix.os }}-${{ matrix.framework }}.xml
      - name: Install Report Generator
        run: dotnet tool restore
      - name: Generate coverage report
        shell: pwsh
        run: |
          dotnet tool run reportgenerator `
            -reports:"${{ github.workspace }}/**/coverage-${{ matrix.os }}-${{ matrix.framework }}.xml" `
            -targetdir:"coverage-report-${{ matrix.os }}-${{ matrix.framework }}" `
            -reporttypes:MarkdownSummaryGithub
      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.framework }}
          path: coverage-report-${{ matrix.os }}-${{ matrix.framework }}
      - name: Show coverage in summary
        shell: pwsh
        run: |
          Get-Content coverage-report-${{ matrix.os }}-${{ matrix.framework }}/SummaryGithub.md |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
