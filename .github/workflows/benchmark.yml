name: benchmark
on:
  workflow_dispatch:
    inputs:
      rowCounts:
        description: "Number of rows separated with comma"
        required: true
        type: string
        default: "10,100,1000"
      framework:
        description: "Target .NET framework"
        required: true
        type: string
        default: "net10.0"
jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Benchmark
        run: |
          dotnet run -c Release --no-restore --no-build \
          --framework ${{ inputs.framework }} \
          --project SpreadsheetGen.Benchmarks -- ${{ inputs.rowCounts }}
          cat BenchmarkDotNet.Artifacts/results/*-report-github.md >> $GITHUB_STEP_SUMMARY
