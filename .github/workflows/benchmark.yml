name: benchmark
on:
  workflow_dispatch:
    inputs:
      rowCounts:
        description: "Number of rows separated with comma"
        required: true
        type: string
        default: "10,100,1000"
      framework:
        description: "Target .NET framework"
        required: true
        type: string
        default: "net10.0"
jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Benchmark
        run: |
          dotnet run -c Release --no-restore --no-build \
          --framework ${{ inputs.framework }} \
          --project SpreadsheetGen.Benchmarks -- ${{ inputs.rowCounts }}
          cat BenchmarkDotNet.Artifacts/results/*-report-github.md >> $GITHUB_STEP_SUMMARY
