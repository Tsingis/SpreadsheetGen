name: benchmark
on:
  workflow_dispatch:
    inputs:
      rowCounts:
        description: "Number of rows separated with comma"
        required: true
        type: string
        default: "10,100,1000"
      framework:
        description: "Target .NET framework"
        required: true
        type: string
        default: "net10.0"
jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Benchmark
        run: |
          dotnet run -c Release --no-restore --no-build \
          --framework ${{ inputs.framework }} \
          --project SpreadsheetGen.Benchmarks -- ${{ inputs.rowCounts }}
          cat BenchmarkDotNet.Artifacts/results/*-report-github.md >> $GITHUB_STEP_SUMMARY
