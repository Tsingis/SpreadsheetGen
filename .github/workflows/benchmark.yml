name: benchmark
on:
  pull_request:
    paths:
      - "SpreadsheetGen/**"
      - "SpreadsheetGen.Benchmarks/**"
      - "Directory.Build.props"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      rowCounts:
        description: "Row counts separated with space"
        required: true
        type: string
        default: "10 100 1000"
      framework:
        description: "Target framework"
        required: true
        type: string
        default: "net10.0"
      runtimes:
        description: "Target runtimes separated with space"
        required: true
        type: string
        default: "net10.0 net11.0"
jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Benchmark
        run: |
          dotnet run -c Release --no-restore --no-build \
            --framework "${{ inputs.framework || 'net10.0' }}" \
            --project SpreadsheetGen.Benchmarks -- \
            --filter "*" \
            --row-counts "${{ inputs.rowCounts || '10 100 1000' }}" \
            --runtimes ${{ inputs.runtimes || 'net10.0 net11.0' }}
      - name: Publish benchmark summary
        run: cat BenchmarkDotNet.Artifacts/results/*-report-github.md >> "$GITHUB_STEP_SUMMARY"
