name: benchmark
on:
  workflow_dispatch:
    inputs:
      rowCounts:
        description: "Row counts separated with space"
        required: true
        type: string
        default: "10 100 1000"
      framework:
        description: "Target framework"
        required: true
        type: string
        default: "net10.0"
      runtimes:
        description: "Target runtimes separated with space"
        required: true
        type: string
        default: "net9.0 net10.0 net11.0"
jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Benchmark
        run: |
          dotnet run -c Release --no-restore --no-build \
          --framework ${{ inputs.framework }} \
          --project SpreadsheetGen.Benchmarks -- \
          --filter "*" \
          --row-counts "${{ inputs.rowCounts }}" \
          --runtimes ${{ inputs.runtimes }}
      - name: Publish benchmark summary
        run: cat BenchmarkDotNet.Artifacts/results/*-report-github.md >> "$GITHUB_STEP_SUMMARY"
